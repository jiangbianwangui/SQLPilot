<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SQLPilot · 自然语言查库 Agent</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --line: #262b38; --txt: #e6e9f0;
    --muted: #97a0b3; --accent: #4f8cff; --ok: #36c08a; --warn: #e0a23b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle button { background: transparent; color: var(--muted); border: none; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .toggle button.active { background: var(--accent); color: #fff; }
  .btn { background: var(--panel); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 18px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 16px; }
  .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg.user .bubble { background: #1f2940; border-color: #2c3a5e; }
  .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
  .trace { margin-top: 8px; border-left: 2px solid var(--line); padding-left: 12px; }
  .trace .step { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .trace .step b { color: var(--accent); }
  .trace pre { background: #0b0e14; border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; color: #cdd6e6; margin: 4px 0 8px; }
  .inputbar { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto; }
  .inputbar input { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--txt); padding: 10px 14px; font-size: 14px; outline: none; }
  .inputbar input:focus { border-color: var(--accent); }
  .inputbar button { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; cursor: pointer; font-size: 14px; }
  .inputbar button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .examples span { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .examples span:hover { border-color: var(--accent); color: var(--txt); }
</style>
</head>
<body>
<header>
  <div>
    <h1>SQLPilot · 自然语言查库 Agent</h1>
    <div class="sub">演示库：SQLite 内存示例（shop：商品/客户/订单）· 安全层：只读校验 + 强制 LIMIT</div>
  </div>
  <div class="controls">
    <div class="toggle">
      <button id="modeSingle" class="active" onclick="setMode('single')">单步 SQLAgent</button>
      <button id="modeAgent" onclick="setMode('agent')">多步 Agent</button>
    </div>
    <button class="btn" onclick="resetSession()">新会话</button>
  </div>
</header>

<div id="log">
  <div class="hint">试试：<b>「北京客户总消费最高的前五名是谁」</b> · 多步模式可追问「那 Top3 呢」</div>
  <div class="examples">
    <span onclick="ask('北京客户总消费最高的前五名是谁')">北京客户 Top5</span>
    <span onclick="ask('各品类销售额排名')">各品类销售额</span>
    <span onclick="ask('库存低于 50 的商品有哪些')">库存预警</span>
    <span onclick="ask('上海客户的订单总金额')">上海客户订单</span>
  </div>
</div>

<div class="inputbar">
  <input id="q" placeholder="用自然语言提问，例如：北京客户总消费最高的前五名是谁" onkeydown="if(event.key==='Enter')send()" />
  <button id="sendBtn" onclick="send()">发送</button>
</div>

<script>
let mode = 'single';
let sessionId = 'web-' + Math.random().toString(36).slice(2);

function setMode(m) {
  mode = m;
  document.getElementById('modeSingle').classList.toggle('active', m === 'single');
  document.getElementById('modeAgent').classList.toggle('active', m === 'agent');
}

function addMsg(role, html) {
  const log = document.getElementById('log');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = `<div class="role">${role === 'user' ? '你' : 'SQLPilot'}</div><div class="bubble">${html}</div>`;
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

async function send() {
  const input = document.getElementById('q');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg('user', esc(q));
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  const placeholder = addMsg('bot', '思考中…');

  try {
    let data;
    if (mode === 'single') {
      const r = await fetch('/api/ask?question=' + encodeURIComponent(q)).then(r => r.json());
      if (r.error && !r.ok && r.sql === undefined) {
        placeholder.querySelector('.bubble').innerHTML = esc(r.error);
      } else {
        let html = '';
        if (r.sql) html += `<b>生成 SQL：</b>\n<code>${esc(r.sql)}</code>\n`;
        if (r.columns && r.rows) {
          html += `\n<b>结果（${r.rows.length} 行）：</b>\n`;
          html += r.rows.slice(0, 10).map(row => '• ' + r.columns.map(c => `${c}=${row[c]}`).join('， ')).join('\n');
        }
        if (r.error) html += `\n⚠️ ${esc(r.error)}`;
        placeholder.querySelector('.bubble').innerHTML = html.replace(/\n/g, '<br>').replace(/<code>/g, '<pre style="background:#0b0e14;border:1px solid #262b38;border-radius:6px;padding:8px;overflow-x:auto;font-size:12px;color:#cdd6e6;margin:4px 0">').replace(/<\/code>/g, '</pre>');
      }
    } else {
      const r = await fetch('/api/agent', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q, session_id: sessionId})
      }).then(r => r.json());
      let html = `<b>回答：</b>${esc(r.text || r.error || '')}`;
      if (r.trace && r.trace.length) {
        html += '<div class="trace">';
        for (const t of r.trace) {
          html += `<div class="step">▸ 调用 <b>${esc(t.tool)}</b>${t.args ? '(' + esc(JSON.stringify(t.args)) + ')' : ''}</div>`;
          html += `<pre>${esc(t.result)}</pre>`;
        }
        html += '</div>';
      }
      placeholder.querySelector('.bubble').innerHTML = html;
    }
  } catch (e) {
    placeholder.querySelector('.bubble').innerHTML = '请求失败：' + esc(e);
  } finally {
    btn.disabled = false;
  }
}

function ask(q) {
  document.getElementById('q').value = q;
  send();
}

async function resetSession() {
  await fetch('/api/reset', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id: sessionId})});
  sessionId = 'web-' + Math.random().toString(36).slice(2);
  document.getElementById('log').innerHTML = '<div class="hint">已开启新会话，记忆已清空。</div>';
}

// 允许 example 点击直达
document.querySelectorAll('.examples span').forEach(s => s.addEventListener('click', () => ask(s.textContent)));
</script>
</body>
</html>
